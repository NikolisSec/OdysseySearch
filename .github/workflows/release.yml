name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build single-file exe
        run: |
          pyinstaller --onefile --name odyssey `
            --collect-all textual --collect-all rich `
            --icon odyssey.ico `
            --version-file odyssey_version.txt `
            --distpath dist odyssey.py
      - name: Code-sign exe (if cert secrets configured)
        if: ${{ secrets.WIN_CERT_BASE64 != '' && secrets.WIN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          $thumb = (Get-PfxCertificate -FilePath $cert).Thumbprint
          Import-PfxCertificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WIN_CERT_PASSWORD -AsPlainText -Force) | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $thumb "dist\odyssey.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-windows
          path: dist/odyssey.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle deps + build deb
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pkg"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/odyssey" "$PKG/usr/share/doc/odyssey"
          pip install -r requirements.txt --target "$PKG/usr/lib/odyssey/deps" --quiet
          cp odyssey.py "$PKG/usr/lib/odyssey/odyssey.py"
          printf '#!/bin/sh\nexec python3 /usr/lib/odyssey/odyssey.py "$@"\n' > "$PKG/usr/bin/odyssey"
          chmod +x "$PKG/usr/bin/odyssey"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: odyssey
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: NikolisSec <nikolissec@users.noreply.github.com>
          Depends: python3 (>= 3.10)
          Homepage: https://github.com/NikolisSec/OdysseySearch
          Description: Search 10 torrent trackers, dedupe, download through Real-Debrid.
           Terminal search engine that merges releases, filters bait, flags instant
           cached results and downloads straight via Real-Debrid.
          EOF
          cp LICENSE "$PKG/usr/share/doc/odyssey/copyright"
          dpkg-deb --build --root-owner-group "$PKG" "odyssey_${VERSION}_all.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-linux
          path: odyssey_*_all.deb

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name "*.exe" -o -name "*.deb" \) | while read -r f; do
            sha256sum "$f" > "$f.sha256"
          done
          find . -name "*.sha256" -exec echo "made {}" \;
          find . -type f \( -name "*.exe" -o -name "*.deb" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/odyssey-windows/odyssey.exe \
            dist/odyssey-windows/odyssey.exe.sha256 \
            dist/odyssey-linux/*_all.deb \
            dist/odyssey-linux/*_all.deb.sha256 \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes